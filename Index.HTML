<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukaan AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🏪 Dukaan AI</h1>

        <p>
            Your AI assistant for your business 🤖
        </p>

        <input
            type="text"
            placeholder="Enter your shop name"
        >

        <button>
            Create My Shop
        </button>
    </div>
<script>
    const input = document.querySelector("input");
    const button = document.querySelector("button");

    button.addEventListener("click", function () {
        const shopName = input.value.trim();

        if (shopName === "") {
            alert("Bhai, pehle shop ka naam likho 😄");
            return;
        }

        alert("🎉 Welcome to Dukaan AI!\nYour shop " + shopName + " is ready!");
    });
</script>
</body>
</html>
