<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}
.box{
  background:white;
  max-width:500px;
  margin:auto;
  padding:25px;
  border-radius:20px;
}
h1{text-align:center}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:16px;
}
.green{background:#16803c}
.red{background:#d33}
.blue{background:#2563eb}
.card{
  background:#f1f1f1;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
}
.hidden{display:none}
.chat{
  background:#f1f1f1;
  min-height:100px;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
#status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#eee;
}
</style>
</head>

<body>

<div class="box">

<h1>🏪 Dukaan AI</h1>

<!-- AUTH -->
<div id="auth">

<h2>👤 Shop Owner</h2>
<p>Create your account or login to manage your shop.</p>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="blue" onclick="signUp()">Create Account</button>

<button onclick="login()">Login</button>

<div id="status"></div>

</div>


<!-- SHOP SETUP -->
<div id="setup" class="hidden">

<h2>🏪 Create Your Shop</h2>

<input id="shopName" placeholder="Shop name">

<button class="green" onclick="createShop()">
Create My Shop
</button>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<h2>📊 Shop Dashboard</h2>

<p id="welcome"></p>

<button class="red" onclick="logout()">Logout</button>

<h3>📦 Add Product</h3>

<input id="productName" placeholder="Product name">

<input id="productPrice" type="number" placeholder="Price">

<input id="productStock" type="number" placeholder="Stock">

<button class="green" onclick="addProduct()">
➕ Add Product
</button>

<div id="products"></div>

<hr>

<h2>🤖 Customer Assistant</h2>

<div id="chat" class="chat">
🤖 Dukaan AI:<br><br>
Hi! How can I help you today? 😊
</div>

<input id="message" placeholder="Customer message">

<button onclick="reply()">Send</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://yrrrqagtnbcufhcswstp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGqvkjDrSAHG2RQxW4ErHw_29yN11YR";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentShop = null;
let products = [];


/* STATUS */

function showStatus(text){

  document.getElementById("status").innerText = text;

}


/* SIGN UP */

async function signUp(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  if(!email || !password){

    showStatus("Please enter email and password.");
    return;
  }

  const {data,error} =
  await supabaseClient.auth.signUp({
    email:email,
    password:password
  });

  if(error){

    showStatus(error.message);
    return;
  }

  if(data.user){

    currentUser = data.user;

    showStatus(
      "Account created successfully. You can now login."
    );
  }
}


/* LOGIN */

async function login(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  if(!email || !password){

    showStatus("Please enter email and password.");
    return;
  }

  const {data,error} =
  await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    showStatus(error.message);
    return;
  }

  currentUser = data.user;

  await loadShop();

}


/* LOAD SHOP */

async function loadShop(){

  const {data,error} =
  await supabaseClient
  .from("shops")
  .select("*")
  .eq("owner_id",currentUser.id)
  .limit(1);

  if(error){

    showStatus(error.message);
    return;
  }

  document.getElementById("auth")
  .classList.add("hidden");

  if(data && data.length > 0){

    currentShop = data[0];

    showDashboard();

  }else{

    document.getElementById("setup")
    .classList.remove("hidden");
  }

}


/* CREATE SHOP */

async function createShop(){

  const name =
  document.getElementById("shopName")
  .value.trim();

  if(!name){

    alert("Please enter your shop name.");
    return;
  }

  const {data,error} =
  await supabaseClient
  .from("shops")
  .insert({
    owner_id:currentUser.id,
    name:name
  })
  .select()
  .single();

  if(error){

    alert(error.message);
    return;
  }

  currentShop = data;

  document.getElementById("setup")
  .classList.add("hidden");

  showDashboard();

}


/* DASHBOARD */

async function showDashboard(){

  document.getElementById("auth")
  .classList.add("hidden");

  document.getElementById("setup")
  .classList.add("hidden");

  document.getElementById("dashboard")
  .classList.remove("hidden");

  document.getElementById("welcome").innerHTML =
  "Welcome to <b>" +
  currentShop.name +
  "</b>! 🎉";

  await loadProducts();

}


/* LOAD PRODUCTS */

async function loadProducts(){

  const {data,error} =
  await supabaseClient
  .from("products")
  .select("*")
  .eq("shop_id",currentShop.id)
  .order("name");

  if(error){

    alert(error.message);
    return;
  }

  products = data || [];

  showProducts();

}


/* ADD PRODUCT */

async function addProduct(){

  const name =
  document.getElementById("productName")
  .value.trim();

  const price =
  document.getElementById("productPrice").value;

  const stock =
  document.getElementById("productStock").value;

  if(!name || price === "" || stock === ""){

    alert("Please fill in all fields.");
    return;
  }

  const {error} =
  await supabaseClient
  .from("products")
  .insert({
    shop_id:currentShop.id,
    name:name,
    price:Number(price),
    stock:Number(stock)
  });

  if(error){

    alert(error.message);
    return;
  }

  document.getElementById("productName").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productStock").value="";

  await loadProducts();

}


/* SHOW PRODUCTS */

function showProducts(){

  const container =
  document.getElementById("products");

  container.innerHTML="";

  products.forEach(function(product){

    container.innerHTML += `
      <div class="card">

        <b>📦 ${product.name}</b><br><br>

        💰 Price: Rs. ${product.price}<br>

        📊 Stock: ${product.stock}

      </div>
    `;

  });

}


/* CUSTOMER ASSISTANT */

function reply(){

  const message =
  document.getElementById("message")
  .value.toLowerCase()
  .trim();

  const chat =
  document.getElementById("chat");

  if(!message){

    alert("Please enter a message.");
    return;
  }

  const product =
  products.find(function(item){

    return message.includes(
      item.name.toLowerCase()
    );

  });


  if(product){

    if(Number(product.stock) > 0){

      chat.innerHTML =
      "🤖 Dukaan AI:<br><br>" +
      "Yes! " +
      product.name +
      " is available. 😊<br>" +
      "💰 Price: Rs. " +
      product.price +
      "<br>📦 Stock: " +
      product.stock;

    }else{

      chat.innerHTML =
      "🤖 Dukaan AI:<br><br>" +
      "Sorry, " +
      product.name +
      " is currently out of stock.";

    }

  }else{

    chat.innerHTML =
    "🤖 Dukaan AI:<br><br>" +
    "Sorry, I couldn't find that product. 😕";

  }

  document.getElementById("message").value="";

}


/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* CHECK EXISTING LOGIN */

async function checkSession(){

  const {data} =
  await supabaseClient.auth.getSession();

  if(data.session){

    currentUser = data.session.user;

    await loadShop();

  }

}

checkSession();

</script>

</body>
</html>
<script>
async function loadProducts() {
  const { data, error } = await supabase
    .from("products")
    .select("*");

  if (error) {
    console.error(error);
    return;
  }

  console.log(data);
}

loadProducts();
</script>
