<!-- Interactive Script -->
  <script>
    document.getElementById('getStartedBtn').addEventListener('click', function() {
        alert('Welcome to Dukaan AI! Redirecting to setup...');
    });

    document.getElementById('trialForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Page refresh hone se rokta hai
        
        const emailInput = document.getElementById('emailInput');
        const email = emailInput.value;
        const msg = document.getElementById('responseMessage');
        
        if (email) {
            msg.textContent = `Success! Trial activated for ${email}.`;
            msg.classList.remove('hidden');
            emailInput.value = ''; // Yahan safely box khali ho jayega bina error ke
        }
    });
  </script>
