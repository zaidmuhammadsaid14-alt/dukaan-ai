<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dukaan AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d0f18] text-[#e2e4f0] font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-gray-800/60 p-4 sm:px-8 flex items-center justify-between max-w-7xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <span class="font-['Outfit'] font-bold text-xl tracking-wide text-white">DUKAAN<span class="text-indigo-500">.AI</span></span>
    </div>
    <nav class="hidden md:flex gap-8 text-sm text-gray-400 font-medium">
      <a href="#features" class="hover:text-white transition">Features</a>
      <a href="#pricing" class="hover:text-white transition">Pricing</a>
    </nav>
    <button id="getStartedBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 cursor-pointer">
      Get Started
    </button>
  </header>

  <!-- Hero Section -->
  <main class="max-w-4xl mx-auto text-center px-4 py-20 flex-1 flex flex-col justify-center items-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full text-xs font-mono mb-6">
      <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
      Powered by AI
    </div>
    
    <h1 class="font-['Outfit'] font-extrabold text-4xl sm:text-6xl text-white mb-6 leading-tight tracking-tight">
      Build Your Store Smartly with <span class="text-indigo-400">Dukaan AI</span>
    </h1>
    
    <p class="text-gray-400 text-base sm:text-lg max-w-2xl mb-10 font-normal">
      Manage inventory, automate sales, and grow your e-commerce business seamlessly with smart AI tools.
    </p>

    <!-- Trial Form -->
    <form id="trialForm" class="flex flex-col sm:flex-row gap-3 w-full justify-center max-w-md">
      <input type="email" id="emailInput" required placeholder="Enter your work email" class="bg-[#161926] border border-gray-800 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-indigo-500 flex-1 text-white placeholder-gray-500 shadow-inner">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 cursor-pointer shrink-0">
        Start Free Trial
      </button>
    </form>
    
    <p id="responseMessage" class="text-emerald-400 text-sm mt-4 font-medium hidden bg-emerald-500/10 border border-emerald-500/20 px-4 py-2 rounded-lg"></p>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800/60 py-6 text-center text-xs text-gray-500">
    © 2026 Dukaan AI. All rights reserved.
  </footer>

  <!-- Interactive Script -->
  <script>
    document.getElementById('getStartedBtn').addEventListener('click', function() {
        alert('Welcome to Dukaan AI! Redirecting to setup...');
    });

    document.getElementById('trialForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const email = document.getElementById('emailInput').value;
        const msg = document.getElementById('responseMessage');
        
        msg.textContent = `Success! Trial activated for ${email}.`;
        msg.classList.remove('hidden');
        document.getElementById('emailInput').value = '';
    });
  </script>
</body>
</html>
