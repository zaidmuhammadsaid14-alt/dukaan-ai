<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dukaan AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #2563eb;
    }

    .header-btn {
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }

    main {
      padding: 70px 0;
    }

    .hero {
      text-align: center;
      max-width: 750px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #2563eb;
    }

    .hero p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      padding: 13px 22px;
      border-radius: 9px;
      font-weight: 700;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
    }

    .secondary-btn {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .status {
      margin-top: 45px;
      padding: 18px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      text-align: left;
    }

    .status strong {
      color: #16a34a;
    }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      main {
        padding: 50px 0;
      }

      .header-inner {
        gap: 10px;
      }

      .logo {
        font-size: 20px;
      }

      .header-btn {
        padding: 9px 13px;
      }

      .hero p {
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-inner">
      <div class="logo">
        Dukaan <span>AI</span>
      </div>

      <button
        class="header-btn"
        onclick="showMessage()"
      >
        Get Started
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">

        <h1>
          Your Smart
          <span>Dukaan</span>
        </h1>

        <p>
          A modern AI-powered marketplace where customers
          can discover products and sellers can manage
          their online business.
        </p>

        <div class="actions">

          <button
            class="primary-btn"
            onclick="showMessage()"
          >
            Start Shopping
          </button>

          <button
            class="secondary-btn"
            onclick="showMessage()"
          >
            Become a Seller
          </button>

        </div>

        <div class="status">
          System Status:
          <strong>Foundation Ready</strong>
        </div>

      </section>
    </div>
  </main>

  <footer>
    © 2026 Dukaan AI. All rights reserved.
  </footer>

  <script>
    "use strict";

    function showMessage() {
      alert("Dukaan AI is ready. Next step: Authentication.");
    }

    console.log("Dukaan AI foundation loaded successfully.");
  </script>

</body>
</html>
