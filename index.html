            <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 20px;
    max-width: 450px;
    margin: 20px auto;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
}

.product {
    background: #f1f1f1;
    padding: 15px;
    margin-top: 12px;
    border-radius: 12px;
}

.delete {
    background: #d33;
}

.section {
    display: none;
}

.chat {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 12px;
    min-height: 80px;
    margin-top: 15px;
}

.nav button {
    width: 49%;
}
</style>
</head>

<body>

<div class="box" id="start">
    <h1>🏪 Dukaan AI</h1>
    <p>Your AI assistant for your business 🤖</p>

    <input id="shopName" placeholder="Enter your shop name">

    <button onclick="createShop()">Create My Shop</button>
</div>

<div class="box section" id="dashboard">

    <h1>🏪 Dukaan AI</h1>

    <h3 id="shopTitle"></h3>

    <div class="nav">
        <button onclick="showDashboard()">📦 Products</button>
        <button onclick="showAssistant()">🤖 Assistant</button>
    </div>

    <div id="productSection">

        <h3>Add Product</h3>

        <input id="productName" placeholder="Product name">
        <input id="productPrice" type="number" placeholder="Price">
        <input id="productStock" type="number" placeholder="Stock">

        <button onclick="addProduct()">➕ Add Product</button>

        <div id="products"></div>

    </div>

    <div id="assistantSection" style="display:none">

        <h3>Customer Assistant</h3>

        <div class="chat" id="chat">
            🤖 Dukaan AI:<br><br>
            Hi! How can I help you today? 😊
        </div>
