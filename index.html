<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yrrqagtnbcufhcswstp.supabase.co";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

</script>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}
.box{
  background:white;
  max-width:500px;
  margin:auto;
  padding:25px;
  border-radius:20px;
}
h1{text-align:center}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:16px;
}
.green{background:#16803c}
.red{background:#d33}
.card{
  background:#f1f1f1;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
}
.hidden{display:none}
.chat{
  background:#f1f1f1;
  min-height:100px;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>🏪 Dukaan AI</h1>

<div id="setup">
<p>Your AI assistant for your business 🤖</p>

<input id="shopName" placeholder="Enter your shop name">

<button onclick="createShop()">Create My Shop</button>
</div>

<div id="dashboard" class="hidden">

<h2>📊 Shop Dashboard</h2>
<p id="welcome"></p>

<h3>📦 Add Product</h3>

<input id="productName" placeholder="Product name">
<input id="productPrice" type="number" placeholder="Price">
<input id="productStock" type="number" placeholder="Stock">

<button class="green" onclick="addProduct()">➕ Add Product</button>

<div id="products"></div>

<hr>

<h2>🤖 Customer Assistant</h2>

<div id="chat" class="chat">
🤖 Dukaan AI:<br><br>
Hi! How can I help you today? 😊
</div>

<input id="message" placeholder="Customer message">

<button onclick="reply()">Send</button>

</div>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

let shop =
localStorage.getItem("shopName") || "";

function createShop(){

  const name =
  document.getElementById("shopName").value.trim();

  if(name === ""){
    alert("Please enter your shop name.");
    return;
  }

  shop = name;

  localStorage.setItem("shopName",shop);

  document.getElementById("setup")
  .classList.add("hidden");

  document.getElementById("dashboard")
  .classList.remove("hidden");

  document.getElementById("welcome").innerHTML =
  "Welcome to <b>" + shop + "</b>! 🎉";

  showProducts();
}

function addProduct(){

  const name =
  document.getElementById("productName").value.trim();

  const price =
  document.getElementById("productPrice").value;

  const stock =
  document.getElementById("productStock").value;

  if(name === "" || price === "" || stock === ""){
    alert("Please fill in all fields.");
    return;
  }

  products.push({
    name:name,
    price:price,
    stock:stock
  });

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  document.getElementById("productName").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productStock").value="";

  showProducts();
}

function showProducts(){

  const container =
  document.getElementById("products");

  container.innerHTML="";

  products.forEach(function(product,index){

    container.innerHTML += `
      <div class="card">
        <b>📦 ${product.name}</b><br><br>
        💰 Price: Rs. ${product.price}<br>
        📊 Stock: ${product.stock}

        <button class="red"
        onclick="deleteProduct(${index})">
        🗑️ Delete
        </button>
      </div>
    `;
  });
}

function deleteProduct(index){

  products.splice(index,1);

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  showProducts();
}

function reply(){

  const message =
  document.getElementById("message")
  .value.toLowerCase()
  .trim();

  const chat =
  document.getElementById("chat");

  if(message === ""){
    alert("Please enter a message.");
    return;
  }

  const product =
  products.find(function(item){

    return message.includes(
      item.name.toLowerCase()
    );

  });

  if(product){

    if(Number(product.stock) > 0){

      chat.innerHTML =
      "🤖 Dukaan AI:<br><br>" +
      "Yes! " + product.name +
      " is available. 😊<br>" +
      "💰 Price: Rs. " +
      product.price + "<br>" +
      "📦 Stock: " +
      product.stock;

    }else{

      chat.innerHTML =
      "🤖 Dukaan AI:<br><br>" +
      "Sorry, " + product.name +
      " is currently out of stock.";

    }

  }else{

    chat.innerHTML =
    "🤖 Dukaan AI:<br><br>" +
    "Sorry, I couldn't find that product. 😕";

  }

  document.getElementById("message").value="";
}

if(shop){

  document.getElementById("setup")
  .classList.add("hidden");

  document.getElementById("dashboard")
  .classList.remove("hidden");

  document.getElementById("welcome").innerHTML =
  "Welcome to <b>" + shop + "</b>! 🎉";

  showProducts();
}

</script>

</body>
</html>
