<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dukaan AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef2ff;color:#111827}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.page{min-height:100vh}
.hero{min-height:100vh;padding:38px 18px 50px;background:linear-gradient(135deg,#4338ca,#2563eb 55%,#0f3b9d);display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:900px}
.brand{text-align:center;color:white;margin-bottom:28px}
.logo{width:86px;height:86px;margin:auto;border-radius:24px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:48px}
.brand h1{font-size:56px;margin:24px 0 10px;letter-spacing:-2px}
.brand h1 span{color:#67e8f9}
.brand p{font-size:21px;line-height:1.45;margin:0 auto;max-width:650px;color:#e0e7ff}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.role-card{border:0;border-radius:28px;padding:30px;text-align:left;min-height:270px;box-shadow:0 18px 45px rgba(0,0,0,.18);transition:transform .12s ease}
.role-card:active{transform:scale(.985)}
.customer{background:white;color:#111827}
.seller{background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.25)}
.role-icon{font-size:44px}
.role-card h2{font-size:30px;margin:24px 0 12px}
.role-card p{font-size:18px;line-height:1.5;margin:0 0 25px;color:#64748b}
.seller p{color:#dbeafe}
.role-action{font-weight:700;font-size:18px;color:#4338ca}
.seller .role-action{color:#67e8f9}
.auth-page{min-height:100vh;padding:22px;background:#f8fafc;display:flex;align-items:center;justify-content:center}
.auth-box{width:100%;max-width:480px;background:white;border-radius:26px;padding:28px;box-shadow:0 15px 45px rgba(15,23,42,.12)}
.back{border:0;background:#eef2ff;color:#3730a3;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:20px}
.auth-box h2{font-size:30px;margin:8px 0}
.sub{color:#64748b;margin-bottom:22px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,select,textarea{width:100%;padding:14px 15px;border:1px solid #cbd5e1;border-radius:13px;outline:none;background:white}
input:focus,select:focus,textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.primary{width:100%;border:0;border-radius:13px;padding:15px;margin-top:20px;background:#4f46e5;color:white;font-weight:800}
.secondary{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:14px;margin-top:10px;background:white;font-weight:700}
.msg{margin-top:14px;padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af}
.app{min-height:100vh;background:#f8fafc}
.topbar{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #e5e7eb;padding:14px 18px;display:flex;align-items:center;gap:12px}
.topbar .title{font-size:22px;font-weight:900;color:#3730a3}
.search{flex:1;max-width:600px;margin:auto}
.search input{background:#f1f5f9;border:0}
.content{max-width:1100px;margin:auto;padding:22px}
.welcome{background:linear-gradient(135deg,#4338ca,#2563eb);color:white;border-radius:24px;padding:25px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.product{background:white;border-radius:18px;padding:16px;border:1px solid #e5e7eb}
.product .pic{height:170px;border-radius:14px;background:#e0e7ff;display:flex;align-items:center;justify-content:center;font-size:58px}
.product h3{margin:14px 0 7px}
.price{font-size:20px;font-weight:900;color:#3730a3}
.empty{background:white;border:1px dashed #cbd5e1;border-radius:18px;padding:35px;text-align:center;color:#64748b}
@media(max-width:700px){
 .hero{padding:25px 14px 35px;align-items:flex-start}
 .brand{margin-top:25px}
 .brand h1{font-size:43px}
 .brand p{font-size:18px}
 .cards{grid-template-columns:1fr}
 .role-card{min-height:245px;padding:26px}
 .role-card h2{font-size:27px}
 .grid{grid-template-columns:1fr 1fr}
 .content{padding:14px}
}
@media(max-width:430px){
 .grid{grid-template-columns:1fr}
 .topbar{flex-wrap:wrap}
 .search{order:3;flex-basis:100%;max-width:none}
}
</style>
</head>
<body>

<div id="landing" class="page">
  <main class="hero">
    <div class="wrap">
      <section class="brand">
        <div class="logo">🛍️</div>
        <h1>Dukaan <span>AI</span></h1>
        <p>A smart marketplace for customers and shops.</p>
      </section>

      <section class="cards">
        <button type="button" class="role-card customer" id="customerBtn">
          <div class="role-icon">🛒</div>
          <h2>I'm a Customer</h2>
          <p>Search products, shop, contact sellers, add to cart and order.</p>
          <div class="role-action">Continue as Customer →</div>
        </button>

        <button type="button" class="role-card seller" id="sellerBtn">
          <div class="role-icon">🏪</div>
          <h2>I'm a Shopkeeper / Seller</h2>
          <p>Create a shop and list your products on the marketplace.</p>
          <div class="role-action">Continue as Seller →</div>
        </button>
      </section>
    </div>
  </main>
</div>

<div id="auth" class="auth-page hidden">
  <div class="auth-box">
    <button type="button" class="back" id="backBtn">← Back</button>
    <h2 id="authTitle">Customer Login</h2>
    <p class="sub" id="authSub">Login or create your customer account.</p>

    <form id="authForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button class="primary" type="submit" id="loginBtn">Login</button>
    </form>

    <button type="button" class="secondary" id="signupBtn">Create New Account</button>
    <div id="authMsg" class="msg hidden"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="title">Dukaan <span style="color:#06b6d4">AI</span></div>
    <div class="search"><input id="searchInput" type="search" placeholder="Search products, shops, categories..."></div>
    <button type="button" class="secondary" style="width:auto;margin:0;padding:10px 13px" id="logoutBtn">Logout</button>
  </header>
  <main class="content">
    <section class="welcome">
      <h2 id="welcomeTitle">Welcome to Dukaan AI</h2>
      <p>Find products from shops in the marketplace.</p>
    </section>
    <div id="products" class="grid"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var currentRole = "";
  var demoProducts = [
    {name:"Blue Shirt",price:"2,000",shop:"Demo Fashion Store",country:"Pakistan"},
    {name:"Smart Watch",price:"5,500",shop:"Tech World",country:"UAE"},
    {name:"Running Shoes",price:"7,900",shop:"Sport House",country:"Germany"},
    {name:"Leather Bag",price:"4,200",shop:"Style Shop",country:"Turkey"},
    {name:"Wireless Earbuds",price:"3,100",shop:"Mobile Hub",country:"Pakistan"},
    {name:"Coffee Maker",price:"8,600",shop:"Home Store",country:"Italy"}
  ];

  function $(id){ return document.getElementById(id); }

  function showAuth(role){
    currentRole = role;
    $("landing").classList.add("hidden");
    $("auth").classList.remove("hidden");
    $("app").classList.add("hidden");

    if(role === "customer"){
      $("authTitle").textContent = "Customer Login";
      $("authSub").textContent = "Login or create your customer account.";
    }else{
      $("authTitle").textContent = "Seller Login";
      $("authSub").textContent = "Login or create your shopkeeper account.";
    }
    $("authMsg").classList.add("hidden");
    window.scrollTo(0,0);
  }

  function goBack(){
    $("auth").classList.add("hidden");
    $("app").classList.add("hidden");
    $("landing").classList.remove("hidden");
    window.scrollTo(0,0);
  }

  function showApp(){
    $("landing").classList.add("hidden");
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("welcomeTitle").textContent = currentRole === "seller"
      ? "Seller Dashboard"
      : "Welcome to Dukaan AI";
    renderProducts("");
    window.scrollTo(0,0);
  }

  function renderProducts(query){
    var q = String(query || "").toLowerCase().trim();
    var list = demoProducts.filter(function(p){
      return !q || (p.name+" "+p.shop+" "+p.country).toLowerCase().indexOf(q) !== -1;
    });

    if(!list.length){
      $("products").innerHTML = '<div class="empty" style="grid-column:1/-1">No products found.</div>';
      return;
    }

    $("products").innerHTML = list.map(function(p){
      return '<article class="product">'
        + '<div class="pic">🛍️</div>'
        + '<h3>'+p.name+'</h3>'
        + '<div class="price">Rs. '+p.price+'</div>'
        + '<p style="color:#64748b;margin-bottom:0">'+p.shop+' · '+p.country+'</p>'
        + '</article>';
    }).join("");
  }

  $("customerBtn").addEventListener("click", function(){ showAuth("customer"); });
  $("sellerBtn").addEventListener("click", function(){ showAuth("seller"); });
  $("backBtn").addEventListener("click", goBack);

  $("signupBtn").addEventListener("click", function(){
    var email = $("email").value.trim();
    if(!email){
      $("authMsg").textContent = "Enter your email first, then tap Create New Account.";
    }else{
      $("authMsg").textContent = "Account setup is ready. Connect your Supabase Auth to create the real account.";
    }
    $("authMsg").classList.remove("hidden");
  });

  $("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    var email = $("email").value.trim();
    if(!email || !$("password").value){
      $("authMsg").textContent = "Please enter email and password.";
      $("authMsg").classList.remove("hidden");
      return;
    }
    showApp();
  });

  $("logoutBtn").addEventListener("click", goBack);
  $("searchInput").addEventListener("input", function(){ renderProducts(this.value); });

  // Expose only the two navigation functions for compatibility with older links.
  window.openAuth = showAuth;
  window.goBack = goBack;
})();
</script>
</body>
</html>
